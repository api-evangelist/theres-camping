name: Theres Camping
description: Theres (데얼스, Theres Co., Ltd.) is a South Korean e-commerce marketplace
  for outdoor and camping gear, where customers buy both new and second-hand equipment
  in one place. The platform aggregates brands and vendors (Grape Box, Camping Khan,
  Ridge Mountain Gear, Matador, and others), offering product search, a shopping cart,
  deal notifications, a community section, and vendor/product listing tools. Based
  in Seoul (Seocho-gu), Theres is a portfolio company of 500 Global. The company
  publishes a consumer web/app storefront and does not currently expose a public
  developer API, documentation, or integration surface.
